name: Python Lint

on:
  push:
    branches:
      - main
      - streamlit_app_v4
    paths:
      - '**.py'
  pull_request:
    branches:
      - main
      - streamlit_app_v4
    paths:
      - '**.py'
  workflow_dispatch:

jobs:
  lint-python:
    name: Lint Python Code with pylint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run pylint
        run: |
          # Lint all Python files (adjust path if needed)
          pylint $(git ls-files '*.py')
