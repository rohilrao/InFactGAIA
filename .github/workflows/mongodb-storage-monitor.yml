name: MongoDB Atlas Storage Monitor
on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:     # Allow manual triggering
  push:
    branches: 
      - main
      - streamlit_app_v4

jobs:
  monitor-mongo-storage:
    name: Check MongoDB Atlas Storage Usage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo
      
      - name: Check MongoDB Atlas storage usage
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python .github/scripts/check_mongodb_usage.py